[package]
name = "voxtype-settings"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4636517c81366b5a277278a53cf43b7cbad22133", default-features = false, features = ["accessibility", "dbus", "native-file-dialog", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4636517c81366b5a277278a53cf43b7cbad22133" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
tempfile = "3"
fs2 = "0.4"

[profile.dev]
debug = 0

[profile.test]
debug = 0
